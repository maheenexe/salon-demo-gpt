name: Cinematic browser preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install site and browser test tool
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Vite and capture cinematic screenshots
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite-cinematic.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/preview-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-preview-screenshots
          path: artifacts/cinematic/
          if-no-files-found: ignore
